[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-field-assessment"
version = "0.1.0"
description = "AI Field Developer assessment: MCP and LLM gateway exercises"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.0,<2",
  "PyJWT>=2.10,<3",
  "pydantic>=2.9,<3",
  "tiktoken>=0.8,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
ai-field-task1 = "ai_field.task1_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_field"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
